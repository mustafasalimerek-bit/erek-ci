name: Flutter checks (reusable)

# The cheap gate: ubuntu, no secrets, safe to run on every push. Anything that
# needs a signing key belongs in android-release.yml or ios-release.yml.
#
# What the gate checks lives in scripts/flutter-preflight.sh. The pre-push hook
# (hooks/pre-push) runs that same file on the Mac, on a clean checkout of the
# commit, before anything reaches main. Change the gate there, not here, or the
# two stop agreeing and the failure emails come back.

on:
  workflow_call:
    inputs:
      app_dir:
        type: string
        default: "."
      flutter_version:
        type: string
        default: "3.41.9"
      check_format:
        type: boolean
        default: false
      check_l10n:
        description: Regenerate localizations and fail if the committed output drifted
        type: boolean
        default: true
      erek_ci_ref:
        description: erek-ci revision whose scripts/flutter-preflight.sh runs; keep it equal to the ref this workflow is called at
        type: string
        default: "main"

jobs:
  checks:
    name: Analyze & test
    # Pinned rather than ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and a runner image changing under the gate is a failure
    # email with no code change behind it. Move deliberately, after a canary.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Fetch the shared gate
        uses: actions/checkout@v5
        with:
          repository: mustafasalimerek-bit/erek-ci
          ref: ${{ inputs.erek_ci_ref }}
          path: .erek-ci

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Analyze, localizations, tests
        env:
          APP_DIR: ${{ inputs.app_dir }}
          CHECK_FORMAT: ${{ inputs.check_format }}
          CHECK_L10N: ${{ inputs.check_l10n }}
          # The calling repo's own token (contents: read), for an app's
          # tool/gate-prepare.sh to fetch its release assets with `gh`.
          GH_TOKEN: ${{ github.token }}
        run: bash .erek-ci/scripts/flutter-preflight.sh "$APP_DIR"
