name: Flutter checks (reusable)

# The cheap gate: ubuntu, no secrets, safe to run on every push. Anything that
# needs a signing key belongs in android-release.yml or ios-release.yml.

on:
  workflow_call:
    inputs:
      app_dir:
        type: string
        default: "."
      flutter_version:
        type: string
        default: "3.41.9"
      check_format:
        type: boolean
        default: false
      check_l10n:
        description: Regenerate localizations and fail if the committed output drifted
        type: boolean
        default: true

jobs:
  checks:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ inputs.app_dir }}
        run: flutter pub get

      - name: Format check
        if: inputs.check_format
        working-directory: ${{ inputs.app_dir }}
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        working-directory: ${{ inputs.app_dir }}
        run: flutter analyze

      - name: Generated localizations are up to date
        if: inputs.check_l10n
        working-directory: ${{ inputs.app_dir }}
        run: |
          # gen_l10n output is derived, so an ARB edited without regenerating
          # should show up here as a diff rather than as missing text on a
          # screen. That only works when the generated .dart files are actually
          # committed — projects with no `output-dir` write into .dart_tool,
          # which git never sees, and the check would pass no matter what.
          if [ ! -f l10n.yaml ]; then
            echo "no l10n.yaml — nothing to check"
            exit 0
          fi
          if [ "$(git ls-files 'lib/l10n/*.dart' 'lib/l10n/**/*.dart' | wc -l)" -eq 0 ]; then
            echo "generated localizations are not tracked in git (gen_l10n writes"
            echo "to .dart_tool here) — this check cannot detect drift, skipping"
            exit 0
          fi
          flutter gen-l10n
          # Scoped to lib/l10n on purpose: `flutter pub get` can rewrite
          # pubspec.lock, and a repo-wide diff would fail on that instead.
          git diff --exit-code -- lib/l10n || {
            echo "gen-l10n changed the committed output — regenerate and commit" >&2
            exit 1
          }

      - name: Tests
        working-directory: ${{ inputs.app_dir }}
        run: flutter test --reporter expanded
